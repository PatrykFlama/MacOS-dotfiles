# AeroSpace – i3/Hyprland-style tiling for macOS.  Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Active when `windowManager = "aerospace"` in flake.nix (modules/darwin/wm/aerospace.nix).
#
# Modifier: press LEFT Option. Karabiner turns left-Option + any key bound here into
# ctrl+option + key, which is what these bindings listen for. Right Option is untouched,
# so it types ą ę ś ł ż ź ć ń ó (Polish Pro) as usual. Pressing real ctrl+option also
# works (e.g. if Karabiner isn't running).
#
# Adding/removing a binding? Run `drs` – the Karabiner key list is generated from this
# file (scripts/gen-karabiner.py). Edits to existing bindings apply on reload (⌥R).
# Left Option + arrows is deliberately NOT remapped (keeps word-jump in text).

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Refresh the SwiftBar workspace indicator (config/swiftbar) on every switch / focus change.
exec-on-workspace-change = ['/bin/bash', '-c', 'open -g "swiftbar://refreshplugin?name=aerospace"']
on-focus-changed = ['exec-and-forget open -g "swiftbar://refreshplugin?name=aerospace"']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
# Only tiling/workspace bindings live here. App launchers (⌥↵ terminal, ⌥F Finder,
# ⌥⇧F yazi, ⌥? cheatsheet, ⌥Space launcher) are Karabiner rules
# (scripts/gen-karabiner.py), so they work with any window manager.

# --- windows ---
# Hyprland-style close: last window closed = app quits. Afterwards, return to the
# workspace we were on – macOS focuses another app's window after a close and AeroSpace
# follows it to that app's workspace (AeroSpace bug #1097). The pause lets macOS finish
# first; you may see a brief flicker. Doesn't cover ⌘W / ⌘Q.
ctrl-alt-q = 'exec-and-forget ws="$(/opt/homebrew/bin/aerospace list-workspaces --focused)"; /opt/homebrew/bin/aerospace close --quit-if-last-window; sleep 0.2; /opt/homebrew/bin/aerospace workspace "$ws"'
ctrl-alt-v = 'layout floating tiling'
ctrl-alt-m = 'fullscreen'
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'

ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'
ctrl-alt-left = 'focus left'
ctrl-alt-down = 'focus down'
ctrl-alt-up = 'focus up'
ctrl-alt-right = 'focus right'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'
ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-down = 'move down'
ctrl-alt-shift-up = 'move up'
ctrl-alt-shift-right = 'move right'

ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'

# --- workspaces ---
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'
ctrl-alt-0 = 'workspace 10'

ctrl-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
ctrl-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
ctrl-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
ctrl-alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
ctrl-alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
ctrl-alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
ctrl-alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
ctrl-alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
ctrl-alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
ctrl-alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

# Cycle through workspaces that have windows (+ the current one), wrapping around.
ctrl-alt-tab = 'exec-and-forget { /opt/homebrew/bin/aerospace list-workspaces --monitor focused --empty no; /opt/homebrew/bin/aerospace list-workspaces --focused; } | sort -un | /opt/homebrew/bin/aerospace workspace --stdin --wrap-around next'
ctrl-alt-shift-tab = 'exec-and-forget { /opt/homebrew/bin/aerospace list-workspaces --monitor focused --empty no; /opt/homebrew/bin/aerospace list-workspaces --focused; } | sort -un | /opt/homebrew/bin/aerospace workspace --stdin --wrap-around prev'

ctrl-alt-r = 'reload-config'
ctrl-alt-shift-semicolon = 'mode service'

# Service mode: rare actions, then back to main.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# --- window rules ---
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
