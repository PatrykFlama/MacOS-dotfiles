# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# General
set -g mouse on
set -sg escape-time 0          # no delay after Esc (important for nvim)
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on        # OSC 52 -> system clipboard

# 1-based windows/panes (matches the keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits open in the current directory
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation / resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Without prefix (Alt binds removed: left Option is the AeroSpace modifier).
bind -n S-Left previous-window
bind -n S-Right next-window

# Vi copy mode, yank to the macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/status-bar.conf
